# ==============================================================================
# ASUS Ascent GX10 DGX Spark GB10 Docker Compose Inference Stack
# Studio: seanhalls.online / sh_hub
# Hardware: 128GB Unified VRAM · NVIDIA DGX Spark GB10
# Services:
#   - vllm-coder: High-throughput OpenAI-compatible API on :8000 (Qwen 2.5 Coder)
#   - ollama-gpu: Local Ollama on :11434 with full NVIDIA GPU passthrough
#   - tei-embeddings: Private Text Embeddings Inference on :8080 (bge-m3)
#   - node-exporter: Prometheus host & hardware metrics on :9100
# ==============================================================================

version: '3.8'

services:
  # 1. vLLM: High-throughput OpenAI-Compatible LLM Server
  vllm-coder:
    image: vllm/vllm-openai:latest
    container_name: asus-vllm-coder
    restart: unless-stopped
    ports:
      - "8000:8000"
    ipc: host
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
    volumes:
      - /opt/asus-land/models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model Qwen/Qwen2.5-Coder-32B-Instruct
      --port 8000
      --max-model-len 32768
      --gpu-memory-utilization 0.85
      --enforce-eager
      --trust-remote-code

  # 2. Ollama GPU: Rapid Experimentation & Local Model Playground
  ollama-gpu:
    image: ollama/ollama:latest
    container_name: asus-ollama-gpu
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /opt/asus-land/data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0

  # 3. Text Embeddings Inference (TEI): High-Performance Private Semantic Search
  tei-embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:turing-1.5
    container_name: asus-tei-embeddings
    restart: unless-stopped
    ports:
      - "8080:8080"
    ipc: host
    volumes:
      - /opt/asus-land/data/tei:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model-id BAAI/bge-m3
      --port 8080
      --max-batch-tokens 16384
      --auto-truncate

  # 4. Host & Hardware Telemetry: Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: asus-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
